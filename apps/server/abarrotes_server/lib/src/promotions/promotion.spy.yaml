### Precio especial de un producto por un periodo. Las fechas son días de la
### tienda (America/Lima): [inicio 00:00, día siguiente al fin 00:00).
class: Promotion
table: promotions
fields:
  id: UuidValue?, defaultPersist=random_v7
  promoPriceCents: int
  startDate: DateTime
  endDate: DateTime
  active: bool, default=true
  product: Product?, relation(name=product_promotions, onDelete=Restrict, onUpdate=Cascade)
  ### A quién va dirigida: a todos, a los clientes VIP o solo a los VIP
  ### elegidos ([recipients]).
  audience: PromotionAudience, default=everyone
  ### Con la audiencia `selected`: los clientes VIP elegidos.
  recipients: List<PromotionRecipient>?, relation(name=promotion_recipients)
  ### Para mostrar la oferta (p. ej. "Semana del arroz"). Opcional.
  title: String?
