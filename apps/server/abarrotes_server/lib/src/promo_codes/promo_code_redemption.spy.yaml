### Un código activado por un cliente: sus promociones le valen hasta
### `expiresAt` (exclusivo) y mientras le queden usos. Uno por cliente y
### código.
class: PromoCodeRedemption
table: promo_code_redemptions
fields:
  id: UuidValue?, defaultPersist=random_v7
  promoCode: PromoCode?, relation(onDelete=Restrict, onUpdate=Cascade)
  user: User?, relation(onDelete=Restrict, onUpdate=Cascade)
  activatedAt: DateTime
  expiresAt: DateTime
indexes:
  promo_code_redemptions_pair_idx:
    fields: promoCodeId, userId
    unique: true
