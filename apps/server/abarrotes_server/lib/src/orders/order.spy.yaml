class: Order
table: orders
fields:
  id: UuidValue?, defaultPersist=random_v7
  ### El número que se le dice al cliente ("Pedido N.º 1024"): correlativo,
  ### desde 1001. Lo pone el servidor al crear el pedido (nextOrderNumber).
  number: int?
  status: OrderStatus, default=pendingConfirmation
  ### A domicilio (por defecto, como todos los pedidos de antes) o recojo en
  ### tienda.
  fulfillmentType: FulfillmentType, default=delivery
  ### Lo que se cobra, en céntimos: el subtotal menos los descuentos.
  totalCents: int
  ### A precio normal, sin los regalos (igual al total en los pedidos de
  ### antes de los tipos de promoción).
  subtotalCents: int, default=0
  ### Lo que ahorraron las promociones (subtotal − total).
  discountCents: int, default=0
  ### Solo a domicilio: el servidor la exige ahí; en recojo va null.
  deliveryAddress: String?
  ### Solo en recojo: 6 caracteres sin 0/O/1/I, que el cliente muestra en caja.
  ### Lo genera el servidor; único en toda la tabla.
  pickupCode: String?
  ### Cuándo quedó listo para recoger.
  readyForPickupAt: DateTime?
  ### Solo a domicilio: como el de recojo, pero lo ve solo el cliente, que se
  ### lo da al repartidor al recibir el pedido. Null en los pedidos de antes
  ### (se entregan sin código).
  deliveryCode: String?
  ### Si se entregó sin el código de entrega: por qué (lo escribe quien
  ### administra la tienda, el único que puede hacerlo).
  deliveredWithoutCodeReason: String?
  createdAt: DateTime, default=now
  ### Serverpod no tiene @updatedAt: lo actualiza quien modifica el pedido.
  updatedAt: DateTime, default=now
  customer: User?, relation(name=user_orders, onDelete=Restrict, onUpdate=Cascade)
  items: List<OrderItem>?, relation(name=order_items)
indexes:
  orders_pickup_code_idx:
    fields: pickupCode
    unique: true
  orders_delivery_code_idx:
    fields: deliveryCode
    unique: true
  orders_number_idx:
    fields: number
    unique: true
