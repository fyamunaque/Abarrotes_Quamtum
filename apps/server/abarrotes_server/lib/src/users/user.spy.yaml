### Cuenta de la plataforma. La autenticación vive en Firebase: aquí se guarda
### el uid de Firebase, nunca una contraseña. Los permisos del personal no
### están aquí: salen de StaffMember y su Role, por el correo.
class: User
table: users
fields:
  id: UuidValue?, defaultPersist=random_v7
  ### uid de Firebase Auth (claim `sub` del ID token).
  firebaseUid: String
  email: String
  ### Lo último que dijo el ID token (email_verified). Lo usa el aviso push,
  ### que no tiene un token del cliente a mano.
  emailVerified: bool, default=false
  name: String
  ### Celular peruano de 9 dígitos, normalizado ("987654321"). Hace falta
  ### para pedir (ver common/customer_requirements.dart).
  phone: String?
  address: String?
  ### DNI de 8 dígitos, opcional: la tienda puede confirmar quién recibe o
  ### recoge un pedido. Único: dos cuentas no comparten DNI.
  dni: String?
  ### Qué versión de los términos de uso y la política de privacidad aceptó
  ### la cuenta, y cuándo. Para pedir hace falta la vigente
  ### (currentTermsVersion).
  termsVersion: String?
  termsAcceptedAt: DateTime?
  createdAt: DateTime, default=now
  orders: List<Order>?, relation(name=user_orders)
  inventoryMovements: List<InventoryMovement>?, relation(name=user_inventory_movements)
  vipCustomersAdded: List<VipCustomer>?, relation(name=user_vip_customers)
  deviceTokens: List<DeviceToken>?, relation(name=user_device_tokens)
  staffMembersAdded: List<StaffMember>?, relation(name=user_staff_members_added)
  auditLogs: List<AuditLog>?, relation(name=user_audit_logs)
  storeSettingsUpdated: List<StoreSettings>?, relation(name=user_store_settings_updated)
indexes:
  users_firebase_uid_idx:
    fields: firebaseUid
    unique: true
  users_email_idx:
    fields: email
    unique: true
  users_dni_idx:
    fields: dni
    unique: true
