name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Un solo run por rama o PR: un push nuevo cancela el que estaba corriendo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (Serverpod)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Base efímera del runner: solo vive durante este job.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: abarrotes
          POSTGRES_PASSWORD: abarrotes-ci
          POSTGRES_DB: abarrotes_server
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U abarrotes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores de prueba, no secretos: reemplazan a config/passwords.yaml.
      SERVERPOD_PASSWORD_database: abarrotes-ci
      SERVERPOD_PASSWORD_serviceSecret: ci-service-secret
      FIREBASE_PROJECT_ID: demo-abarrotes-ci
    defaults:
      run:
        working-directory: apps/server/abarrotes_server
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib bin test
      - name: Análisis
        run: dart analyze --fatal-infos
      # Los de integración crean y borran una base temporal por grupo.
      - name: Tests unitarios y de integración
        run: dart test
      - name: Migraciones sobre una base vacía y arranque del servidor
        run: |
          dart run bin/main.dart --role maintenance --apply-migrations
          dart run bin/main.dart > server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -s -o /dev/null http://localhost:8082/users/me && break
            sleep 1
          done
          expect() {
            local want=$1; shift
            local got; got=$(curl -s -o /dev/null -w '%{http_code}' "$@" || true)
            [ "$got" = "$want" ] || { echo "$* -> $got (esperaba $want)"; cat server.log; exit 1; }
          }
          api=http://localhost:8082
          expect 401 "$api/users/me"
          expect 401 -H 'Authorization: Bearer basura' "$api/users/me"
          expect 200 "$api/categories"
          expect 401 -X POST "$api/categories"
          expect 200 "$api/products?onSale=true"
          expect 401 "$api/promotions"
          expect 401 -X POST "$api/inventory/movements"
          expect 401 "$api/inventory/alerts/low-stock"
          expect 401 "$api/orders?status=confirmed"
          expect 401 -X PATCH "$api/orders/0199a000-0000-7000-8000-000000000000/status"
          expect 401 "$api/stats/overview"
          expect 401 "$api/stats/sales?from=2026-01-01&to=2026-01-31"

  client:
    name: Cliente (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Análisis
        run: flutter analyze --fatal-infos
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web
